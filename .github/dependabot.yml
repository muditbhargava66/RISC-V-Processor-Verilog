# Dependabot version updates for the RISC-V processor repository.
#
# This is a SystemVerilog RTL project. The only dependency manifest is the
# GitHub Actions workflow under .github/workflows (ci.yml). There are no
# language package ecosystems (no package.json / requirements.txt / etc.),
# so only the github-actions ecosystem is tracked here.
#
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    # Batch routine action bumps into a single PR to reduce noise.
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"